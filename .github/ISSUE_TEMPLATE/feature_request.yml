name: 功能建议
description: 提议新的能力或体验改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请描述当前遇到的问题，而不只是期望的实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、行为或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果尝试过其他方式，请说明其不足。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
        - label: 该建议符合 macOS 菜单栏截图翻译工具的项目范围。
          required: true
