name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 OpenScreenTranslate。请勿在报告中提交 API Key 或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 可在设置页面的“关于”区域查看。
      placeholder: 例如 1.2.3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与设备
      description: 请注明 macOS 版本和 Mac 芯片架构。
      placeholder: 例如 macOS 15.6，Apple M2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 截图与屏幕录制权限
        - OCR 文本识别
        - AI 翻译
        - 全局快捷键
        - 设置与钥匙串
        - 启动、菜单栏或窗口
        - 构建与发布
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最短、稳定的复现流程。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可添加已脱敏日志、截图或录屏。请先移除 API Key 和个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我确认报告中不包含 API Key 或其他敏感信息。
          required: true
