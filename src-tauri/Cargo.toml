[package]
name = "openscreentranslate"
version = "0.1.0"
description = "A macOS menu bar app for screenshot translation"
authors = ["OpenScreenTranslate contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "openscreentranslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-autostart = "2"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
